<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#07070c">
<title>XYVERO • Official Links</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
:root{
  --bg:#050508;
  --card:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.13);
  --purple:#7c4dff;
  --blue:#00c8ff;
  --text:#fff;
  --muted:#999;
}
html{
  scroll-behavior:smooth;
}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  overflow-x:hidden;
}
/* ================= BACKGROUND ================= */
.background{
  position:fixed;
  inset:0;
  z-index:-5;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(124,77,255,.25),
      transparent 32%
    ),
    radial-gradient(
      circle at 80% 90%,
      rgba(0,200,255,.14),
      transparent 32%
    ),
    #050508;
}
.grid{
  position:absolute;
  inset:-100%;
  opacity:.12;
  background-image:
    linear-gradient(
      rgba(255,255,255,.04) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.04) 1px,
      transparent 1px
    );
  background-size:45px 45px;
  transform:rotate(12deg);
  animation:gridMove 20s linear infinite;
}
@keyframes gridMove{
  from{
    transform:translate(0,0) rotate(12deg);
  }
  to{
    transform:translate(45px,45px) rotate(12deg);
  }
}
.glow{
  position:absolute;
  width:320px;
  height:320px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.22;
  animation:orb 10s ease-in-out infinite alternate;
}
.glow.one{
  background:var(--purple);
  top:-150px;
  left:-100px;
}
.glow.two{
  background:var(--blue);
  right:-130px;
  bottom:-150px;
  animation-delay:3s;
}
@keyframes orb{
  from{
    transform:translate(0,0) scale(1);
  }
  to{
    transform:translate(100px,80px) scale(1.25);
  }
}
/* ================= PARTICLES ================= */
.particles{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.particle{
  position:absolute;
  width:3px;
  height:3px;
  background:white;
  border-radius:50%;
  opacity:.35;
  animation:particleFloat 7s infinite ease-in-out;
}
.p1{left:10%;top:20%}
.p2{left:80%;top:15%;animation-delay:1s}
.p3{left:25%;top:70%;animation-delay:2s}
.p4{left:90%;top:55%;animation-delay:3s}
.p5{left:55%;top:85%;animation-delay:4s}
.p6{left:40%;top:10%;animation-delay:2.5s}
@keyframes particleFloat{
  0%,100%{
    transform:translateY(0);
    opacity:.15;
  }
  50%{
    transform:translateY(-35px);
    opacity:.7;
  }
}
/* ================= CONTAINER ================= */
.container{
  width:100%;
  max-width:470px;
  margin:auto;
  padding:35px 18px 35px;
}
/* ================= TOP BAR ================= */
.topbar{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-bottom:10px;
}
.top-btn{
  width:42px;
  height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  border:1px solid var(--border);
  color:white;
  font-size:17px;
  backdrop-filter:blur(18px);
  cursor:pointer;
  transition:.25s;
}
.top-btn:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,.13);
  box-shadow:0 0 25px rgba(124,77,255,.35);
}
/* ================= PROFILE ================= */
.profile-area{
  text-align:center;
  animation:profileIn .8s ease;
}
.avatar-wrapper{
  position:relative;
  display:inline-block;
}
.avatar-ring{
  padding:4px;
  border-radius:50%;
  background:
    linear-gradient(
      135deg,
      #fff,
      var(--purple),
      var(--blue),
      #fff
    );
  background-size:300% 300%;
  animation:ringMove 5s linear infinite;
  box-shadow:
    0 0 25px rgba(124,77,255,.7),
    0 0 70px rgba(124,77,255,.25);
}
@keyframes ringMove{
  0%{
    background-position:0% 50%;
  }
  50%{
    background-position:100% 50%;
  }
  100%{
    background-position:0% 50%;
  }
}
.avatar{
  width:108px;
  height:108px;
  display:block;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #08080d;
}
.online{
  position:absolute;
  right:3px;
  bottom:8px;
  width:20px;
  height:20px;
  background:#22c55e;
  border:3px solid #08080d;
  border-radius:50%;
  box-shadow:0 0 12px #22c55e;
}
.name{
  margin-top:18px;
  font-size:30px;
  font-weight:850;
  letter-spacing:2px;
}
.verified{
  display:inline-flex;
  width:19px;
  height:19px;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#2389ff;
  font-size:11px;
  vertical-align:middle;
}
.username{
  margin-top:5px;
  color:#777;
  font-size:13px;
}
.bio{
  margin:12px auto 0;
  max-width:320px;
  color:#aaa;
  font-size:14px;
  line-height:1.5;
}
/* ================= STATUS ================= */
.status{
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin-top:15px;
  padding:7px 13px;
  border-radius:30px;
  background:rgba(34,197,94,.08);
  border:1px solid rgba(34,197,94,.18);
  color:#7ee2a2;
  font-size:12px;
  font-weight:600;
}
.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
}
/* ================= SOCIAL ================= */
.socials{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:24px 0 30px;
}
.social{
  width:46px;
  height:46px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:50%;
  color:white;
  text-decoration:none;
  font-size:13px;
  font-weight:800;
  background:rgba(255,255,255,.07);
  border:1px solid var(--border);
  backdrop-filter:blur(18px);
  transition:.25s;
}
.social:hover{
  transform:translateY(-5px) scale(1.05);
  background:rgba(124,77,255,.18);
  box-shadow:
    0 0 25px rgba(124,77,255,.4);
}
/* ================= SECTION ================= */
.section{
  margin-bottom:28px;
}
.section-title{
  margin:0 5px 12px;
  color:#777;
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
}
/* ================= LINK CARDS ================= */
.links{
  display:flex;
  flex-direction:column;
  gap:13px;
}
.link{
  position:relative;
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px 55px;
  color:white;
  text-decoration:none;
  font-size:15px;
  font-weight:700;
  border-radius:18px;
  background:
    linear-gradient(
      110deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.045)
    );
  border:1px solid var(--border);
  backdrop-filter:blur(20px);
  box-shadow:
    0 10px 35px rgba(0,0,0,.28),
    inset 0 1px rgba(255,255,255,.08);
  overflow:hidden;
  animation:linkIn .7s ease both;
  transition:.25s;
}
.link::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      110deg,
      transparent 25%,
      rgba(255,255,255,.10),
      transparent 75%
    );
  transform:translateX(-100%);
  transition:.5s;
}
.link:hover::before{
  transform:translateX(100%);
}
.link:hover{
  transform:translateY(-3px) scale(1.015);
  background:
    linear-gradient(
      110deg,
      rgba(124,77,255,.23),
      rgba(255,255,255,.07)
    );
  box-shadow:
    0 0 25px rgba(124,77,255,.25),
    0 15px 40px rgba(0,0,0,.4);
}
.icon{
  position:absolute;
  left:17px;
  width:31px;
  height:31px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:10px;
  background:rgba(255,255,255,.08);
  font-size:16px;
}
.arrow{
  position:absolute;
  right:18px;
  color:#777;
  font-size:20px;
  transition:.25s;
}
.link:hover .arrow{
  color:#fff;
  transform:translateX(4px);
}
/* ANIMATION DELAYS */
.link:nth-child(1){animation-delay:.05s}
.link:nth-child(2){animation-delay:.10s}
.link:nth-child(3){animation-delay:.15s}
.link:nth-child(4){animation-delay:.20s}
.link:nth-child(5){animation-delay:.25s}
.link:nth-child(6){animation-delay:.30s}
.link:nth-child(7){animation-delay:.35s}
/* ================= FOOTER ================= */
.footer{
  text-align:center;
  margin-top:35px;
  color:#555;
  font-size:11px;
  letter-spacing:1px;
}
.footer span{
  color:#777;
}
/* ================= TOAST ================= */
.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:
    translateX(-50%)
    translateY(80px);
  padding:12px 18px;
  border-radius:30px;
  background:rgba(20,20,25,.9);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(20px);
  color:white;
  font-size:13px;
  opacity:0;
  transition:.3s;
  z-index:99;
}
.toast.show{
  opacity:1;
  transform:
    translateX(-50%)
    translateY(0);
}
/* ================= KEYFRAMES ================= */
@keyframes profileIn{
  from{
    opacity:0;
    transform:translateY(-25px) scale(.95);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}
@keyframes linkIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
/* ================= MOBILE ================= */
@media(max-width:380px){
  .container{
    padding:25px 14px 30px;
  }

    font-size:26px;
  }
  .avatar{
    width:95px;
    height:95px;
  }
  .link{
    min-height:57px;
  }
}
</style>
</head>

<script>
/* ================= TOAST ================= */
function showToast(message){
  const toast =
    document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  setTimeout(() => {
    toast.classList.remove("show");
  },2200);
}
/* ================= COPY ================= */
async function copyLink(){
  try{
    await navigator.clipboard.writeText(
      window.location.href
    );
    showToast(
      "Link berhasil disalin"
    );
  }catch{
    showToast(
      "Gagal menyalin link"
    );
  }
}
/* ================= SHARE ================= */
async function sharePage(){
  const shareData = {
    title:"XYVERO",
    text:"Semua link resmi XYVERO",
    url:window.location.href
  };
  if(
    navigator.share
  ){
    try{
      await navigator.share(
        shareData
      );
    }catch{
      /* User cancelled */
    }
  }else{
    copyLink();
  }
}
</script>
